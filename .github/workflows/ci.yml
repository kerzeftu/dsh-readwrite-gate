name: ci

on:
  push:
    branches: [main, 'verify/grant-storage']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - run: npm test

  grant-storage:
    name: Grant storage (${{ matrix.os }}, DSH ${{ matrix.dsh }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        dsh: ['0.2.1-alpha.1', '0.2.1-rc.3', '0.2.2-rc.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test with real Harness storage packages
        shell: pwsh
        env:
          DSH_VERSION: ${{ matrix.dsh }}
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'gate-storage-deps'
          New-Item -ItemType Directory -Path $stage | Out-Null
          function Invoke-Checked([string]$label, [scriptblock]$run) {
            $output = @(& $run 2>&1)
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) {
              $message = "$label (exit $code): " + (($output | Select-Object -First 20) -join "`n")
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Host "::error::$message"
              exit $code
            }
          }
          Invoke-Checked 'Install storage packages' {
            npm install --prefix $stage --registry=https://registry.npmjs.org --ignore-scripts --omit=optional --no-package-lock --no-audit --no-fund "@deepseek-ai/dsh-storage-domain@$env:DSH_VERSION" "@deepseek-ai/dsh-storage-json@$env:DSH_VERSION"
          }
          $domain = Join-Path $stage 'node_modules/@deepseek-ai/dsh-storage-domain/lib/index.js'
          $json = Join-Path $stage 'node_modules/@deepseek-ai/dsh-storage-json/lib/index.js'
          Invoke-Checked 'Test persistence' { node test/check-grant-storage.mjs $domain $json }
